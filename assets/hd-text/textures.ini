# The HD text MHForever ships (a texture pack in PPSSPP's format, drawn with or without the player's own pack).
# The game builds its Latin character map at boot from MHForever's free font (fonts/LiberationSans-Regular.ttf);
# this is that map at 16 times its size, drawn by Kaneda. It is the map of the European and North American releases
# (Japan and FUComplete build others); a change to the font or its size changes the key.
# The glyphs-XXXX.png next to it are the glyph sheets (font_glyphs.hpp), drawn by Kaneda: every character of the font
# at 8 times its size, a sheet per block of 256 code points, greyscale (the grey is the coverage).
[options]
version = 1
hash = quick

