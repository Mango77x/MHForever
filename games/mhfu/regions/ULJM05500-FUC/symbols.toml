# Symbol map for ULJM05500 patched with FUComplete v1.4.0 (the player's own Japanese image, patched with FUComplete's own
# tool). See docs/06-mhfu-module.md. Addresses only; no game code or data.
# FUComplete's executable (SHA-1 2eeca67c5daa63a7bcfac0d56fc9aa23a090fa5e) keeps the layout of the Japanese one: every
# function and data address of ULJM05500/symbols.toml is unchanged (checked 2026-11-07 by comparing both executables and
# the overlays), so the sections below are a copy of that map. Keep them in step with it.

[functions]
mh_main                 = 0x089094D4 # module entry point (the ELF's own entry)

# Overlay manager (docs/04-recompiler.md section 4.4). Groups: 0 eboot, 1 task, 2 sub, 3 em, 4 stage, 5 debug.
mh_overlay_request      = 0x0888FE4C # (System*, file_id, group): starts an async read of DATA.BIN file `file_id` into the group's region
mh_overlay_finish       = 0x0888FF00 # (System*, file_id, group): completes the load, calls mh_overlay_prepare, records the active id
mh_overlay_is_active    = 0x0888FF8C # (System*, group, file_id) -> bool
mh_overlay_prepare      = 0x0890B844 # (image*, size): cache maintenance, clears .bss after the image, runs its static initializers
mh_static_init_run      = 0x08909DA4 # (begin, end, ...): runs a static-initializer table (used for overlays and the executable)

# Supply box (--fast-supply-box; found 2026-11-05 by matching the EU function; 0x50 lower than in EU). Taking an item
# out sets a u8 cooldown in the Player to 30 frames; this function counts it down once per frame and ignores the buttons
# until it reaches 0.
mh_supply_box_update    = 0x088476A4 # (?, Player*): the supply box menu, once per frame while it is open

# Smithy lists in lobby_task.ovl (--smithy-browse; found 2026-11-05 by matching the EU code). The list a function gets
# holds the cursor (s16 at +0x3C), the Info level (u8 at +0x22: 0 the list, 1 Info) and flags (u32 at +0x4C, 0x20: the R
# panel).
mh_smithy_create_list_update  = 0x09A9DD78 # (List*): the create lists (weapons, armor), once per frame
mh_smithy_improve_list_update = 0x09A9F8F8 # (List*): the improve list, once per frame

[data]
mh_overlay_region_bases = 0x089C6B40 # u32[6], region base address per group

# Menu display of weapon values (--true-weapon-values; verified 2026-11-02). Damage never reads these.
mh_attack_display_multipliers = 0x08938104 # u32[11], per weapon class: menus show attack * value / 100
# The "0" the element value format prints after the value, and the same "0" in the dual-element total format (the only
# language of this release; its menu text is loaded at run time).
mh_element_value_format_zero_ja = 0x089CABCC # u8
mh_dual_element_value_zero_ja   = 0x089CABE5 # u8
# The hunting horn's songs (games/mhfu/host/horn_songs.cpp; found 2026-11-02 from the code that plays a note, and checked
# in a quest). Struct offsets used with these are the same in the three releases (see horn_songs.cpp).
mh_game_sys             = 0x089C7508 # GameSys*: the hunter's equipment, which player this machine plays
mh_player_manager       = 0x09A4AE04 # PlayerManager*: the Player* of each player slot
mh_blademaster_weapons  = 0x089574C8 # 24 bytes per blademaster weapon id: model id u16 at +0x00, a horn's note set u8 at +0x13
mh_weapon_model_classes = 0x08975984 # u8 per weapon model id: its weapon class (8 = hunting horn)
mh_horn_note_colors     = 0x089B2FB8 # u8[20][3]: the colour of notes 1-3 for each of the horns' 20 note sets
mh_horn_songs           = 0x09C06EA8 # u8[47][4] in game_task.ovl: each song's notes, newest first (see horn_songs.cpp)
mh_resource_manager     = 0x09A07280 # ResourceManager*: the loaded resources by id (the quest text is resource 4)
mh_quest_message_texts  = 0x089B0744 # u16 per quest message (the songs' effects first): its text id in the quest text
mh_cockpit              = 0x089C6CBC # Cockpit*: the quest HUD and its menus (Cockpit_menu_chk: a game menu is open)

# Smithy Info panels (--smithy-browse): functions in lobby_task.ovl the game program calls, (List*): build the
# Info panel for the item under the list's cursor.
mh_smithy_create_info_setup  = 0x09A9E4E8
mh_smithy_improve_info_setup = 0x09A9FDD0

[offsets]
system_active_overlays  = 0x00F7A3C0 # u16[6] inside System, active DATA.BIN file id per group (0xFFFF = none)

# Instruction patches (docs/04-recompiler.md section 6), switched on by --smithy-browse. Each list skips the cursor
# move (and paging) while the R panel is open (a test of flag 0x20; immediate 0 never finds it set) and while
# Info is open (a branch on the Info level, never taken).
[patches]
mh_smithy_create_requires_blocks_up_down     = "lobby_task.ovl 0x09A9DED4 immediate 0"
mh_smithy_create_requires_blocks_paging      = "lobby_task.ovl 0x09A9DF98 immediate 0"
mh_smithy_create_info_blocks_up_down         = "lobby_task.ovl 0x09A9DEC8 never"
mh_smithy_improve_requires_blocks_up_down    = "lobby_task.ovl 0x09A9FA5C immediate 0"
mh_smithy_improve_info_blocks_up_down        = "lobby_task.ovl 0x09A9FA50 never"
mh_smithy_decoration_requires_blocks_up_down = "lobby_task.ovl 0x09AA2A8C immediate 0"
mh_smithy_decoration_requires_blocks_paging  = "lobby_task.ovl 0x09AA2B74 immediate 0"

