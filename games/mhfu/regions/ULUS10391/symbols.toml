# Canonical symbol map for ULUS10391 (US, DISC_VERSION 1.01). See docs/06-mhfu-module.md section 5.
# Addresses only; no game code or data. Found on 2026-10-25 by matching the European functions (ULES01213/symbols.toml)
# byte for byte in the US executable (SHA-1 540fa53711ccd3a500a2ff01a71946406085a627), ignoring the immediates that hold
# addresses: each function has exactly one match. The code up to mh_overlay_is_active sits where it does in the EU
# executable; from there on everything, code and data, is 0x120 bytes higher. The region table was checked by reading
# it: it holds the EU values plus 0x100 for the overlay groups, as the program headers of the US executable say.
# The language screen counter is not in the image but in the game's own allocation, so it is 0x140 above the EU one.
# It was found on 2026-10-30 by diffing whole-RAM dumps paired with the dumped display.

[functions]
mh_main                 = 0x08906A54 # module entry point (the ELF's own entry)

# Overlay manager (docs/04-recompiler.md section 4.4). Groups: 0 eboot, 1 task, 2 sub, 3 em, 4 stage, 5 debug.
mh_overlay_request      = 0x08890144 # (System*, file_id, group): starts an async read of DATA.BIN file `file_id` into the group's region
mh_overlay_finish       = 0x088901F8 # (System*, file_id, group): completes the load, calls mh_overlay_prepare, records the active id
mh_overlay_is_active    = 0x08890284 # (System*, group, file_id) -> bool
mh_overlay_prepare      = 0x0890DEBC # (image*, size): cache maintenance, clears .bss after the image, runs its static initializers
mh_static_init_run      = 0x0890C41C # (begin, end, ...): runs a static-initializer table (used for overlays and the executable)

# Supply box (--fast-supply-box; found 2026-11-05 by matching the EU function; same address as in EU). Taking an item
# out sets a u8 cooldown in the Player to 30 frames; this function counts it down once per frame and ignores the buttons
# until it reaches 0.
mh_supply_box_update    = 0x088476F4 # (?, Player*): the supply box menu, once per frame while it is open

# Smithy lists in lobby_task.ovl (--smithy-browse; found 2026-11-05 by matching the EU code; 0x100 higher, like the
# overlay). The list a function gets holds the cursor (s16 at +0x3C), the Info level (u8 at +0x22: 0 the list, 1 Info)
# and flags (u32 at +0x4C, 0x20: the R panel).
mh_smithy_create_list_update  = 0x09AA2EE0 # (List*): the create lists (weapons, armor), once per frame
mh_smithy_improve_list_update = 0x09AA4A60 # (List*): the improve list, once per frame

[data]
mh_overlay_region_bases = 0x089CBB90 # u32[6], region base address per group
mh_language_screen_stage = 0x08B21844 # u32, boot scene counter: 7 while the language screen waits (docs/06-mhfu-module.md section 8)

# Menu display of weapon values (--true-weapon-values; verified 2026-11-02, all five languages). Damage never reads
# these. Every address is the EU one plus 0x120.
mh_attack_display_multipliers = 0x0893ACDC # u32[11], per weapon class: menus show attack * value / 100
# The "0" the element value format prints after the value, and the same "0" in the dual-element total format. The game
# loads the chosen language's menu text at run time, each language at its own place.
mh_element_value_format_zero_en = 0x089CF142 # u8
mh_dual_element_value_zero_en   = 0x089CF159 # u8
mh_element_value_format_zero_fr = 0x089CF2F0 # u8
mh_dual_element_value_zero_fr   = 0x089CF306 # u8
mh_element_value_format_zero_de = 0x089CF2CB # u8
mh_dual_element_value_zero_de   = 0x089CF2E3 # u8
mh_element_value_format_zero_es = 0x089CF282 # u8
mh_dual_element_value_zero_es   = 0x089CF299 # u8
mh_element_value_format_zero_it = 0x089CF235 # u8
mh_dual_element_value_zero_it   = 0x089CF24D # u8
# The hunting horn's songs (games/mhfu/host/horn_songs.cpp; found 2026-11-02 from the code that plays a note, and checked
# in a quest). Struct offsets used with these are the same in the three releases (see horn_songs.cpp).
mh_game_sys             = 0x089CC558 # GameSys*: the hunter's equipment, which player this machine plays
mh_player_manager       = 0x09A4F204 # PlayerManager*: the Player* of each player slot
mh_blademaster_weapons  = 0x0895A0EC # 24 bytes per blademaster weapon id: model id u16 at +0x00, a horn's note set u8 at +0x13
mh_weapon_model_classes = 0x089785A8 # u8 per weapon model id: its weapon class (8 = hunting horn)
mh_horn_note_colors     = 0x089B7F38 # u8[20][3]: the colour of notes 1-3 for each of the horns' 20 note sets
mh_horn_songs           = 0x09C0BD38 # u8[47][4] in game_task.ovl: each song's notes, newest first (see horn_songs.cpp)
mh_resource_manager     = 0x09A0B680 # ResourceManager*: the loaded resources by id (the quest text is resource 4)
mh_quest_message_texts  = 0x089B56C4 # u16 per quest message (the songs' effects first): its text id in the quest text
mh_cockpit              = 0x089CBD0C # Cockpit*: the quest HUD and its menus (Cockpit_menu_chk: a game menu is open)

# Smithy Info panels (--smithy-browse): functions in lobby_task.ovl the game program calls, (List*): build the
# Info panel for the item under the list's cursor.
mh_smithy_create_info_setup  = 0x09AA3650
mh_smithy_improve_info_setup = 0x09AA4F38

[offsets]
system_active_overlays  = 0x00F7A580 # u16[6] inside System, active DATA.BIN file id per group (0xFFFF = none); built by the same instructions as in EU

# Instruction patches (docs/04-recompiler.md section 6), switched on by --smithy-browse. Each list skips the cursor
# move (and paging) while the R panel is open (a test of flag 0x20; immediate 0 never finds it set) and while
# Info is open (a branch on the Info level, never taken).
[patches]
mh_smithy_create_requires_blocks_up_down     = "lobby_task.ovl 0x09AA303C immediate 0"
mh_smithy_create_requires_blocks_paging      = "lobby_task.ovl 0x09AA3100 immediate 0"
mh_smithy_create_info_blocks_up_down         = "lobby_task.ovl 0x09AA3030 never"
mh_smithy_improve_requires_blocks_up_down    = "lobby_task.ovl 0x09AA4BC4 immediate 0"
mh_smithy_improve_info_blocks_up_down        = "lobby_task.ovl 0x09AA4BB8 never"
mh_smithy_decoration_requires_blocks_up_down = "lobby_task.ovl 0x09AA7BF4 immediate 0"
mh_smithy_decoration_requires_blocks_paging  = "lobby_task.ovl 0x09AA7CDC immediate 0"

# Call patches registered by --analog-camera: the European camera code, at the same addresses (found 2026-11-08 by
# matching it in this executable).
mh_camera_buttons_copied     = "executable 0x0888D094 call" # the camera has copied its buttons from the pad (a0 is 1 when it took them all)
mh_camera_tilt_preset_chosen = "executable 0x088870B4 call" # the tilt level has picked the preset the camera moves to
mh_camera_turn_buttons_test  = "executable 0x08887474 call" # the camera tests whether Left or Right is held (a1)
mh_camera_turn_amount_chosen = "executable 0x088874A4 call" # v1 holds this frame's turn amount (Left adds, Right subtracts)
