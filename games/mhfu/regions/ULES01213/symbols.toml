# Canonical symbol map for ULES01213 (EU, DISC_VERSION 1.01). See docs/06-mhfu-module.md §5.
# Addresses only; no game code or data. Every entry was verified against the reference EU executable
# (SHA-1 04b60ee797bd628faa0525ebd52186fa05967963) on 2026-10-16.

[functions]
mh_main                 = 0x08906934 # module entry point

# Overlay manager (docs/04-recompiler.md §4.4). Groups: 0 eboot, 1 task, 2 sub, 3 em, 4 stage, 5 debug.
mh_overlay_request      = 0x08890144 # (System*, file_id, group): starts an async read of DATA.BIN file `file_id` into the group's region
mh_overlay_finish       = 0x088901F8 # (System*, file_id, group): completes the load, calls mh_overlay_prepare, records the active id
mh_overlay_is_active    = 0x08890284 # (System*, group, file_id) -> bool
mh_overlay_prepare      = 0x0890DD9C # (image*, size): cache maintenance, clears .bss after the image, runs its static initializers
mh_static_init_run      = 0x0890C2FC # (begin, end, ...): runs a static-initializer table (used for overlays and the executable)

# Supply box (--fast-supply-box; found 2026-11-05 in a quest with PPSSPP's debugger). Taking an item out sets a u8
# cooldown in the Player to 30 frames; this function counts it down once per frame and ignores the buttons until it
# reaches 0.
mh_supply_box_update    = 0x088476F4 # (?, Player*): the supply box menu, once per frame while it is open

# Smithy lists in lobby_task.ovl (--smithy-browse; found 2026-11-05 in the village with PPSSPP's debugger). The list a
# function gets holds the cursor (s16 at +0x3C), the Info level (u8 at +0x22: 0 the list, 1 Info) and flags (u32 at
# +0x4C, 0x20: the R panel).
mh_smithy_create_list_update  = 0x09AA2DE0 # (List*): the create lists (weapons, armor), once per frame
mh_smithy_improve_list_update = 0x09AA4960 # (List*): the improve list, once per frame
mh_smithy_panel_draw          = 0x09A83BD8 # (List*): the panel the list shows (details, materials or Info)
mh_smithy_model_update        = 0x09AB70C8 # (Model*): the smithy's weapon model; the left stick turns it

[data]
mh_language_screen_stage = 0x08B21704 # u32, boot scene counter: 7 while the language screen waits (docs/06-mhfu-module.md §8)
mh_overlay_region_bases = 0x089CBA70 # u32[6], region base address per group

# Menu display of weapon values (--true-weapon-values; verified 2026-11-02). Damage never reads these.
mh_attack_display_multipliers = 0x0893ABBC # u32[11], per weapon class: menus show attack * value / 100
# The "0" the element value format prints after the value, and the same "0" in the dual-element total format. The game
# loads the chosen language's menu text at run time, each language at its own place.
mh_element_value_format_zero_en = 0x089CF022 # u8
mh_dual_element_value_zero_en   = 0x089CF039 # u8
mh_element_value_format_zero_fr = 0x089CF1D0 # u8
mh_dual_element_value_zero_fr   = 0x089CF1E6 # u8
mh_element_value_format_zero_de = 0x089CF1AB # u8
mh_dual_element_value_zero_de   = 0x089CF1C3 # u8
mh_element_value_format_zero_es = 0x089CF162 # u8
mh_dual_element_value_zero_es   = 0x089CF179 # u8
mh_element_value_format_zero_it = 0x089CF115 # u8
mh_dual_element_value_zero_it   = 0x089CF12D # u8
# The hunting horn's songs (games/mhfu/host/horn_songs.cpp; found 2026-11-02 from the code that plays a note, and checked
# in a quest). Struct offsets used with these are the same in the three releases (see horn_songs.cpp).
mh_game_sys             = 0x089CC438 # GameSys*: the hunter's equipment, which player this machine plays
mh_player_manager       = 0x09A4F0C4 # PlayerManager*: the Player* of each player slot
mh_blademaster_weapons  = 0x08959FCC # 24 bytes per blademaster weapon id: model id u16 at +0x00, a horn's note set u8 at +0x13
mh_weapon_model_classes = 0x08978488 # u8 per weapon model id: its weapon class (8 = hunting horn)
mh_horn_note_colors     = 0x089B7E18 # u8[20][3]: the colour of notes 1-3 for each of the horns' 20 note sets
mh_horn_songs           = 0x09C0BC38 # u8[47][4] in game_task.ovl: each song's notes, newest first (see horn_songs.cpp)
mh_resource_manager     = 0x09A0B540 # ResourceManager*: the loaded resources by id (the quest text is resource 4)
mh_quest_message_texts  = 0x089B55A4 # u16 per quest message (the songs' effects first): its text id in the quest text
mh_cockpit              = 0x089CBBEC # Cockpit*: the quest HUD and its menus (Cockpit_menu_chk: a game menu is open)

# Smithy Info panels (--smithy-browse): functions in lobby_task.ovl the game program calls, (List*): build the
# Info panel for the item under the list's cursor.
mh_smithy_create_info_setup  = 0x09AA3550
mh_smithy_improve_info_setup = 0x09AA4E38
# Smithy layout (--smithy-layout): tables in lobby_task.ovl the smithy screens draw from, (s16 x, s16 y) pairs. The
# game program changes some entries while Info is open and puts them back when it closes.
mh_smithy_panel_layout   = 0x09B04438 # 19 pairs, copied every frame by mh_smithy_panel_draw (10 Info, 11-15 materials)
mh_smithy_side_layout    = 0x09B04558 # 5 pairs: the weapon model's box (0, 1) and the bottom help bar (3, 4)
mh_smithy_question_box   = 0x09B041C8 # the question box: position, size, then its text's position at +0xC
mh_smithy_skill_info_hint = 0x09B04238 # 1 pair: where the Skill Info hint ends (it is right-aligned)
mh_smithy_model_scissor  = 0x09B085D0 # first entry: the screen rectangle the weapon model is drawn in
mh_smithy_panel_draw_entry = 0x09A83BD8 # mh_smithy_panel_draw, which the game program also calls (both panels at once)
mh_pad_input             = 0x08A62C64 # Pad*: this frame's buttons and sticks as the game reads them (s8 stick x at +2, y at +4)

[offsets]
system_active_overlays  = 0x00F7A580 # u16[6] inside System, active DATA.BIN file id per group (0xFFFF = none)

# Instruction patches (docs/04-recompiler.md section 6), switched on by --smithy-browse. Each list skips the cursor
# move (and paging) while the R panel is open (a test of flag 0x20; immediate 0 never finds it set) and while
# Info is open (a branch on the Info level, never taken).
[patches]
mh_smithy_create_requires_blocks_up_down     = "lobby_task.ovl 0x09AA2F3C immediate 0"
mh_smithy_create_requires_blocks_paging      = "lobby_task.ovl 0x09AA3000 immediate 0"
mh_smithy_create_info_blocks_up_down         = "lobby_task.ovl 0x09AA2F30 never"
mh_smithy_improve_requires_blocks_up_down    = "lobby_task.ovl 0x09AA4AC4 immediate 0"
mh_smithy_improve_info_blocks_up_down        = "lobby_task.ovl 0x09AA4AB8 never"
mh_smithy_decoration_requires_blocks_up_down = "lobby_task.ovl 0x09AA7AF4 immediate 0"
mh_smithy_decoration_requires_blocks_paging  = "lobby_task.ovl 0x09AA7BDC immediate 0"
# --smithy-layout: the list is drawn while Info is open, and left/right pages the list instead of Info.
mh_smithy_list_hidden_with_info              = "lobby_task.ovl 0x09A824D0 never"
mh_smithy_create_info_takes_left_right       = "lobby_task.ovl 0x09AA2FF4 never"
