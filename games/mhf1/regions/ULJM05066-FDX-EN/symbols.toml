# Freedom DX on ULJM05066: Freedom DX patches the executable in place and leaves these addresses as they are, so the
# map is the release's (regions/ULJM05066).
# Found 2026-11-17 by matching the European map (regions/ULES00318) against this executable: the instructions at each
# European address, with jump targets and address-like immediates masked, occur once here, and mh_main is the ELF's own
# entry. mh_draw_done is read from mh_draw_wait's own code.

[functions]
mh_main             = 0x08899C2C # entry point (the ELF's)
mh_overlay_prepare  = 0x088AF6F4 # (image, size): an overlay is in memory, its static initializers about to run
mh_static_init_run  = 0x088ADC88 # runs a module's static initializers
mh_draw_wait        = 0x088496CC # (): returns once mh_draw_done is set

[data]
mh_draw_done        = 0x08979AB5 # u8: set when the game's drawing for the frame is done (mh_draw_wait waits for it)

# Words Freedom DX rewrites at run time (docs/04-recompiler.md section 6, guarded words). At every start it reads its
# options from FDXDAT/CONFIG.BIN and stores them into the code: the field of view (five instructions), the starting
# camera height, the supply box delay, the minimap's scale and position, and the Dos bonuses' hook in the executable;
# at each quest, hold to gather, Lao-Shan Lung's early kill and the Sword and Shield change in game_task.ovl; and the
# event quests' page count and the offline treasure quests in lobby_task.ovl. A function holding one of these words
# runs in the interpreter once the word has changed, so the options take effect as on the PSP.
[guards]
fdx_executable = "executable 0x08816038 0x088161D4 0x08816218 0x088162E8 0x0881D54C 0x0881D558 0x0881D560 0x0882CFA4 0x08848A84 0x08848A88 0x0886AC1C 0x0886D1AC"
fdx_game_task  = "game_task.ovl 0x098D84C0 0x098F9988 0x0990CCBC 0x0990CCC0 0x0990CCC4 0x0990CCC8"
fdx_lobby_task = "lobby_task.ovl 0x098ED6B4 0x098EE894 0x09908624"
