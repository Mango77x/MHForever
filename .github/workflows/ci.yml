name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for game data or derived content
        run: python3 scripts/check_repo_content.py

  build:
    needs: content-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-clang
          - os: windows-2022
            preset: windows-clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libasound2-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev
      - name: Install pspdev toolchain for our homebrew tests (Linux)
        if: runner.os == 'Linux'
        env:
          PSPDEV_RELEASE: v20261001
          PSPDEV_SHA256: a86efe624e770005290919617859e9df24bd8fcd3e364f4587f23ec7364b0acd
        run: |
          curl -sSfL -o pspdev.tar.gz \
            "https://github.com/pspdev/pspdev/releases/download/${PSPDEV_RELEASE}/pspdev-ubuntu-latest-x86_64.tar.gz"
          echo "${PSPDEV_SHA256}  pspdev.tar.gz" | sha256sum --check -
          sudo tar xzf pspdev.tar.gz -C /opt
          rm pspdev.tar.gz
          echo "PSPDEV=/opt/pspdev" >> "$GITHUB_ENV"
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # AddressSanitizer + UndefinedBehaviorSanitizer over the whole test suite.
  sanitizers:
    needs: content-guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libclang-rt-18-dev pkg-config libwebkit2gtk-4.1-dev \
            libgtk-3-dev libasound2-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev
      - name: Install pspdev toolchain for our homebrew tests
        env:
          PSPDEV_RELEASE: v20261001
          PSPDEV_SHA256: a86efe624e770005290919617859e9df24bd8fcd3e364f4587f23ec7364b0acd
        run: |
          curl -sSfL -o pspdev.tar.gz \
            "https://github.com/pspdev/pspdev/releases/download/${PSPDEV_RELEASE}/pspdev-ubuntu-latest-x86_64.tar.gz"
          echo "${PSPDEV_SHA256}  pspdev.tar.gz" | sha256sum --check -
          sudo tar xzf pspdev.tar.gz -C /opt
          rm pspdev.tar.gz
          echo "PSPDEV=/opt/pspdev" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset linux-clang-asan
      - name: Build
        run: cmake --build --preset linux-clang-asan
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset linux-clang-asan
